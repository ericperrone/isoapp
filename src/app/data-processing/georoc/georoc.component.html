<app-header>[initialStatus]="'transitionLeft'"></app-header>
<div class="application-page" @fade>
    <div class="w95 centered data-gathering-header">
        <div class="step">Georoc authors list</div>
        <div class="data-gathering-nav">
            <span class="far fa-arrow-alt-circle-left data-gathering-arrows" (click)="goPrevious()"></span>
        </div>
    </div>
    <div *ngIf="spinnerOn === true" class="spinner-div">
        <div class="d-flex align-items-center w50 bordered-rounded centered">
            Loading authors list from Georoc.
            <div class="spinner-border ms-auto" role="status" aria-hidden="true"></div>
        </div>
    </div>
    <div class="w95 centered data-gathering-header">
        <input list="authlist" type="text" class="form-control" id="auth" placeholder="Enter Author's last name"
            [(ngModel)]="lastName" (ngModelChange)="getAuthors()">
        <datalist #authlist id="authlist"></datalist>
    </div>

</div>
