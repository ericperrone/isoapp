<div class="modal-header">
    <h5 class="modal-title" id="modal-basic-title">Dataset upload</h5>
</div>
<div class="modal-body">
    <form>
        <div class="form-group">
            <label for="ref">Dataset reference</label>
            <input type="text" class="form-control" id="ref" placeholder="Enter reference" aria-describedby="refhelp">
            <small id="refhelp" class="form-text text-muted">Enter any information about document referred by dataset
                file.</small>
        </div>
        <div class="form-group">
            <label for="auth">Author(s)</label>
            <input type="text" class="form-control" id="auth" placeholder="Enter Author(s)" aria-describedby="authhelp">
            <small id="authhelp" class="form-text text-muted">Enter the authors list</small>
        </div>
    </form>
    <div class="m-10 w95 centered">
        <div class="inline-block">Press the button to get the dataset file or drop the file in the above area.</div>
        <!-- <div class="inline-block"><button type="button" class="btn btn-outline-dark">Choose file</button></div> -->
        <div class="w95 centered text-center"><input type="file" class="form-control file-upload" onchange="console.log(event.target.files)"></div>
        <div class="mt-2 w80 bordered-rounded h-5em centered text-center"><i style="color: lightgray; margin-top: 1em;" class="fa-solid fa-paperclip fa-2xl"></i></div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-outline-dark" (click)="cancel()">Cancel</button>
    <button type="button" class="btn btn-outline-dark" (click)="confirm()">Submit</button>
</div>
