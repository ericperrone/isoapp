<div class="w90 text-center">
    <div class="centered text-center">
        <input type="text" class="form-control" placeholder="Endmember name" [(ngModel)]="filter"
            (ngModelChange)="selectNames()">
    </div>
    <div class="centered text-center scrollable w100" style="max-height: 8em;">
        <table class="w100">
            <tr *ngFor="let sn of nameList" (click)="select(sn)" class="clickable">
                <td>{{ sn }}</td>
            </tr>
        </table>
    </div>
    <div class="centered text-center scrollable w100" style="max-height: 8em;">
        <table class="w100" *ngIf="!!showReservoir">
            <tr>
                <th>Name</th>
                <th>Element</th>
                <th>Value</th>
                <th>Unit</th>
            </tr>
            <tr *ngFor="let r of this.reservoirs">
                <td>{{ r.name }}</td>
                <td>{{ r.element }}</td>
                <td>{{ r.value }}</td>
                <td>{{ r.um ? r.um : '' }}</td>
            </tr>
        </table>
    </div>
</div>
