<div class="formlab-header">
    <!-- <i class="bi-alarm" style="font-size: 2rem; color: rgb(255, 255, 255);"></i> -->
    <!-- <i class="bi bi-list" color="white"></i>     -->
    <div style="display:inline-block" class="clickable" (click)="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list"
            viewBox="0 0 16 16">
            <path fill-rule="evenodd"
                d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z" />
        </svg>        
    </div>

    <div style="display:inline-block; margin-left: 1em;">
        ISOTOPE Portal
    </div>
    <!-- <div class="float-right header-logo mr2"><img src="assets/logo.png" height="70%"></div> -->
    <div class="sidebar-off background-light-dark" *ngIf="transition === 'sideOff'">
        <p class="clickable sidebar-item" (click)="gotoDbQueries()">Database querying</p>
        <p class="clickable sidebar-item" (click)="gotoDataProcessing()">Data import</p>
        <p class="clickable sidebar-item" (click)="gotoGeo()">Test</p>
    </div>
    <div class="sidebar-on background-light-dark" *ngIf="transition === 'sideOn'">
        <p class="clickable sidebar-item" (click)="gotoDbQueries()">Database querying</p>
        <p class="clickable sidebar-item" (click)="gotoDataProcessing()">Data import</p>
        <p class="clickable sidebar-item" (click)="gotoGeo()">Test</p>
    </div>
    <div class="sidebar-left background-light-dark" *ngIf="transition === 'transitionLeft'">
        <p class="clickable sidebar-item" (click)="gotoDbQueries()">Database querying</p>
        <p class="clickable sidebar-item" (click)="gotoDataProcessing()">Data import</p>
        <p class="clickable sidebar-item" (click)="gotoGeo()">Test</p>
    </div>
    <div class="sidebar-right background-light-dark" *ngIf="transition === 'transitionRight'">
        <p class="clickable sidebar-item" (click)="gotoDbQueries()">Database querying</p>
        <p class="clickable sidebar-item" (click)="gotoDataProcessing()">Data import</p>
        <p class="clickable sidebar-item" (click)="gotoGeo()">Test</p>
    </div>

</div>
